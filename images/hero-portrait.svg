<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" width="460" height="520">
  <defs>
    <!-- Skin tones & Shading Gradients -->
    <linearGradient id="skinMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d8"/>
      <stop offset="45%" stop-color="#dfcaa7"/>
      <stop offset="85%" stop-color="#a78b71"/>
      <stop offset="100%" stop-color="#644e3b"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2d21" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#19130e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="jawHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#fdf4ec" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5e6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Head Aura -->
  <circle cx="230" cy="210" r="170" fill="#6186C8" opacity="0.08" filter="blur(28px)" />

  <!-- Black T-Shirt & Shoulders (Realistic Studio Silhouette) -->
  <path d="M 40 520 C 55 420, 110 380, 160 365 C 190 380, 260 380, 290 365 C 340 380, 400 420, 420 520 Z" fill="url(#shirtGrad)"/>
  <!-- Crewneck Collar Contour -->
  <path d="M 160 365 C 190 390, 260 390, 290 365 C 280 395, 170 395, 160 365 Z" fill="#27272a"/>

  <!-- Neck & Throat (Arched Upward & Tilted Back) -->
  <path d="M 175 365 C 170 290, 185 245, 205 210 C 240 215, 275 235, 280 270 C 285 305, 280 345, 275 365 Z" fill="#8a6e55"/>
  <!-- Deep Throat Shadow -->
  <path d="M 180 360 C 185 300, 200 250, 218 225 C 235 270, 240 320, 245 365 Z" fill="url(#skinShadow)"/>
  <!-- Sternocleidomastoid Muscle Highlight (Chiseled Arched Neck) -->
  <path d="M 210 218 C 225 255, 248 315, 262 360 C 255 360, 240 320, 225 270 Z" fill="#dfcaa7" opacity="0.65"/>
  <path d="M 218 220 C 228 260, 248 310, 255 350" stroke="#f5e6d8" stroke-width="3" stroke-linecap="round" opacity="0.4" filter="blur(1px)"/>

  <!-- Head Base Shape (Side/3-Quarter Profile Angled Upward to the Right) -->
  <path d="M 160 210 C 145 160, 165 100, 215 75 C 265 55, 320 80, 335 135 C 345 175, 330 220, 295 240 C 255 258, 215 255, 185 235 C 170 225, 163 218, 160 210 Z" fill="#a78b71"/>

  <!-- Facial Planes & Soft Lighting (Looking Up) -->
  <!-- Forehead to Cheekbone Highlight -->
  <path d="M 230 78 C 275 68, 320 95, 330 140 C 335 165, 328 190, 305 215 C 290 190, 270 150, 240 100 Z" fill="url(#skinMain)"/>

  <!-- Chiseled Jawline Definition & Rim Light -->
  <path d="M 205 210 C 235 220, 270 230, 295 240 C 285 248, 250 248, 215 235 Z" fill="#2d2218"/>
  <path d="M 208 212 C 240 222, 275 232, 295 238" stroke="url(#jawHighlight)" stroke-width="4.5" stroke-linecap="round" filter="blur(0.5px)"/>

  <!-- Nose Profile (Pointed upward) -->
  <path d="M 305 130 C 322 135, 332 144, 324 154 C 315 157, 305 152, 298 142 Z" fill="#edd6c0"/>
  <path d="M 308 132 C 320 137, 326 144, 320 150" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Closed Eye & Eyelash Curve (Serene Expression) -->
  <path d="M 275 125 C 283 130, 292 130, 298 126" stroke="#2b1f17" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Eyebrow -->
  <path d="M 268 112 C 282 112, 298 118, 308 122" stroke="#1c140e" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Lips Contour (Relaxed, parted slightly) -->
  <path d="M 292 172 C 302 174, 312 177, 308 183 C 298 185, 290 180, 288 174 Z" fill="#8d5b4c"/>
  <path d="M 294 173 C 304 175, 310 178, 304 180" stroke="#4a251b" stroke-width="2"/>

  <!-- Chin Contour -->
  <path d="M 288 200 C 302 205, 306 215, 295 225 C 282 225, 275 218, 278 205 Z" fill="#d8be9f"/>

  <!-- Ear Definition -->
  <path d="M 185 175 C 172 165, 170 145, 180 135 C 192 125, 202 135, 200 155 C 198 175, 192 185, 185 175 Z" fill="#9c7a5e"/>
  <path d="M 182 160 C 178 150, 180 140, 188 138" stroke="#3d281a" stroke-width="2.5" fill="none"/>

  <!-- Curly Black Hair Volume (Thick Texture matching reference) -->
  <!-- Base mass -->
  <path d="M 160 210 C 135 185, 130 145, 140 105 C 150 70, 175 45, 215 38 C 255 30, 295 45, 320 70 C 335 88, 340 115, 325 130 C 315 110, 295 85, 260 75 C 220 65, 180 85, 165 125 C 152 155, 158 185, 160 210 Z" fill="#09090b"/>
  <!-- Hair Curls & Tuft Layers -->
  <circle cx="165" cy="100" r="22" fill="#18181b"/>
  <circle cx="190" cy="65" r="25" fill="#111113"/>
  <circle cx="225" cy="50" r="26" fill="#18181b"/>
  <circle cx="265" cy="52" r="24" fill="#111113"/>
  <circle cx="300" cy="68" r="22" fill="#18181b"/>
  <circle cx="325" cy="95" r="20" fill="#111113"/>
  <circle cx="145" cy="135" r="20" fill="#111113"/>
  <circle cx="148" cy="170" r="18" fill="#18181b"/>
  <!-- Subtle Hair Rim Highlights -->
  <path d="M 185 55 C 225 40, 270 42, 305 60" stroke="#52525b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" filter="blur(1px)"/>
  <path d="M 150 120 C 145 95, 160 70, 185 55" stroke="#3f3f46" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Soft Studio Gradient Fade at Bottom -->
  <rect x="0" y="380" width="460" height="140" fill="url(#fadeBottom)"/>
</svg>